name: Release

# Publishes agent-guard-core and agent-guard-spring-boot-starter to the Sonatype
# Central Portal, in "validate, do not release" mode. The last step is always a human:
# the bundle sits at https://central.sonatype.com/publishing/deployments until the maintainer
# presses Publish. Nothing here can put an artifact on Maven Central on its own
# (pom.xml, release profile: <autoPublish>false</autoPublish>).
#
# Two ways in:
#   * workflow_dispatch with a version input, e.g. 0.1.0  (no tag needed, for a rehearsal)
#   * pushing a tag v0.1.0                                (the normal path)
#
# The version is derived, never read from the pom: main always carries 0.1.0-SNAPSHOT and
# the workflow rewrites the poms in the runner's checkout only. Nothing is committed back.
#
# Full instructions, including the one-off setup, are in the release runbook (maintained privately).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v and no -SNAPSHOT (e.g. 0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

# Read-only token. This workflow writes nothing to the repository: no commit, no tag,
# no GitHub release. id-token is deliberately NOT requested: central-publishing-maven-plugin
# authenticates to the Central Portal with the user-token pair (CENTRAL_USERNAME /
# CENTRAL_TOKEN), not with OIDC, so a workload identity token would be an unused privilege.
permissions:
  contents: read

concurrency:
  # L2: keyed on the version, not the ref. A workflow_dispatch of 0.1.0 on main and a
  # push of tag v0.1.0 are different refs and would otherwise run, sign and upload the
  # same deployment name twice at once.
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  # N6: pinned at workflow level so it reaches every job and step unless a step explicitly
  # overrides MAVEN_OPTS ("Reproducibility check" is the only one that does, and it keeps
  # this same log level appended to its own override - see the comment there). This is the
  # actual close of I4/N6, not just the guard step below that only detects a debug flag
  # after the fact: an externally-supplied MAVEN_OPTS/MAVEN_ARGS (an Actions variable, a
  # runner default, anything set outside this file) cannot win over the value this workflow
  # declares for itself.
  MAVEN_ARGS: "-B"
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.defaultLogLevel=info"

jobs:
  publish:
    name: Verify, sign, upload to the Central Portal
    runs-on: ubuntu-latest
    # M5: gate the job that holds the signing key behind a required reviewer. This can
    # only be enforced once the repository is public (GitHub Environments need a paid plan
    # on a private repo: `environments` -> total_count 0 today, see L7). The line stays:
    # it becomes the actual gate the day the `release` environment is created with
    # the maintainer as a required reviewer, which is itself a precondition of the first
    # release (see the release runbook). Do not remove it to make the workflow
    # "work" before then.
    environment: release
    steps:
      # M5/L3: full history for the ancestry check below, and the checkout token is
      # never written to .git/config - the release job never talks to git again after
      # the ancestry/signature checks, so there is nothing here that should be able to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # M5/N8: any tag on any commit could otherwise start a release, including one that
      # lives only on a scratch branch and was never reviewed. This used to be conditioned
      # on the tag-push trigger only, on the (wrong) theory that a workflow_dispatch run is
      # gated by who can trigger it and that set is no broader than who can push a tag -
      # true, but it is exactly the same set, not a narrower one, so the ancestry check
      # bought nothing by skipping the dispatch path. It now runs unconditionally on both
      # triggers: on a workflow_dispatch, $GITHUB_SHA is the tip of whatever ref was chosen
      # in the UI, which is precisely the commit about to be released, so the same
      # ancestor-of-main check applies unchanged.
      - name: Verify the released commit is on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main"; exit 1; }

      # N5/M5: require the tag itself to be signed and verifiable, not just its commit to be
      # reviewed - and require it unconditionally on the tag-push path. The previous version
      # skipped this check entirely (a warning, then exit 0) whenever
      # vars.RELEASE_SIGNING_KEY_ID was unset, which made the control's default state OFF and
      # the signal that it was off a warning line in a log nobody reads on a run that goes
      # green; the "do not block workflow_dispatch" reasoning bought nothing, because this
      # step is already scoped to the tag-push trigger only (below). It also only asserted
      # that SOME key in the runner's keyring produced a good signature, never that it was
      # the configured one (reproduced: a tag signed by an attacker's key verified cleanly
      # once the attacker's key was also in the keyring) - `git verify-tag --raw` and a
      # VALIDSIG match on the full fingerprint binds the check to that exact key.
      - name: Verify the tag signature
        if: github.event_name == 'push'
        env:
          RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY_ID:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY_ID is not set (Settings -> Secrets and variables -> Actions -> Variables). A release tag must be verifiable against a known key; see the release runbook."
            exit 1
          fi
          if ! [[ "$RELEASE_SIGNING_KEY_ID" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::RELEASE_SIGNING_KEY_ID must be the full 40-character key fingerprint, not a short key id or email"
            exit 1
          fi
          fingerprint="${RELEASE_SIGNING_KEY_ID^^}"
          gpg --keyserver keyserver.ubuntu.com --recv-keys "$fingerprint"
          git verify-tag --raw "$GITHUB_REF_NAME" 2>&1 | tee /tmp/verify-tag.out
          # F3: "VALIDSIG <fpr> ..." names the key that MADE the signature in its first field,
          # which is the SIGNING SUBKEY whenever the release key has one (git tag -s uses the
          # subkey even when -u names the primary). The PRIMARY key fingerprint - the value
          # The release runbook has the maintainer put in RELEASE_SIGNING_KEY_ID via `gpg --fingerprint`
          # - is always the LAST field of the same status line, for both key shapes: a primary
          # with no signing subkey signs with itself, so its own fingerprint is both the first
          # and the last field. Matching the last field therefore binds the control to the
          # identity (the primary), which is what RELEASE_SIGNING_KEY_ID is supposed to name and
          # what stays correct across subkey rotation, while still refusing a tag signed by any
          # other key.
          grep -qE "^\[GNUPG:\] VALIDSIG [0-9A-F]{40} .* ${fingerprint}\$" /tmp/verify-tag.out \
            || { echo "::error::$GITHUB_REF_NAME is not signed by $fingerprint"; exit 1; }

      # I4/N6: Maven's debug output (`-X`/`--debug`, `-e`/`--errors` for stack traces, or the
      # slf4j simple-logger level set directly to debug/trace) prints the whole process
      # environment, including CENTRAL_TOKEN, CENTRAL_USERNAME and MAVEN_GPG_PASSPHRASE, in
      # clear. GitHub's secret masking only replaces exact registered strings, so a value
      # that reaches the log through any transformation (e.g. a stack trace fragment) is not
      # masked. The original guard matched only three literal flags; `--errors` (the long
      # form of `-e`) and `-Dorg.slf4j.simpleLogger.defaultLogLevel=debug`/`trace` (which
      # print the identical [DEBUG] env dump without ever touching `-X`) walked straight
      # past it - reproduced against this repository. This guard, plus the job-level
      # MAVEN_ARGS/MAVEN_OPTS pin above, is the actual close; nothing today adds a debug
      # flag, and this step refuses to let a future "just add -X to see what's wrong" change
      # reach the Maven invocations in this job.
      #
      # N6 (run 34389977548, tag v0.1.0): the first version of this guard matched the bare
      # words `simpleLogger` and `defaultLogLevel` unconditionally, so it refused the
      # workflow's own job-level pin (`-Dorg.slf4j.simpleLogger.defaultLogLevel=info`) on
      # every run, before anything was uploaded. The pattern below only refuses the level
      # actually being debug/trace (`defaultLogLevel=(debug|trace)`), which still catches
      # the two real holes this guard exists for and no longer catches the info pin this
      # same workflow declares for itself two steps up. The belt check right after this
      # already proves MAVEN_OPTS is EXACTLY the info-level pin, so nothing is lost by no
      # longer matching the bare property name.
      - name: Refuse Maven debug output in this job
        run: |
          set -euo pipefail
          debug_pattern='(^|[[:space:]])(-X|--debug|-e|--errors)([[:space:]]|$)|defaultLogLevel=(debug|trace)|maven\.debug'
          if printf '%s\n%s\n' "${MAVEN_ARGS:-}" "${MAVEN_OPTS:-}" | grep -Eiq "$debug_pattern"; then
            echo "::error::refusing to run Maven with a debug flag or debug log level: MAVEN_ARGS/MAVEN_OPTS carries one that prints secrets in clear (I4/N6)"
            exit 1
          fi
          # Belt: MAVEN_OPTS must be EXACTLY the info-level pin this workflow declares for
          # itself at job level - not merely free of a debug marker, so an env override
          # cannot win by substituting some other, still-undesirable, value either.
          if [ "${MAVEN_OPTS:-}" != "-Dorg.slf4j.simpleLogger.defaultLogLevel=info" ]; then
            echo "::error::MAVEN_OPTS in this job must be exactly '-Dorg.slf4j.simpleLogger.defaultLogLevel=info' (N6); got '${MAVEN_OPTS:-}'"
            exit 1
          fi
          # Static check that the Maven invocations further down this same job never pass
          # one of the debug flags on their own command line either. Scoped to the two
          # "run:" blocks that actually invoke mvnw in the publish job (by line range, sed
          # between their "- name:" and the next), so this does not match its own source
          # (this step also mentions these flags, in a string, not as a flag).
          for step in 'Set the release version in the checkout' 'Verify, licence check, sign, upload'; do
            if printf '%s' "$(sed -n "/- name: ${step}\$/,/^      - name:/p" .github/workflows/release.yml)" \
                | grep -vE '^\s*#' \
                | grep -Eiq "$debug_pattern"; then
              echo "::error::forbidding a Maven debug flag or debug log level on the '$step' command line (I4/N6)"
              exit 1
            fi
          done

      # Keyless CVE gate, release half (B-CI-02). The pinned scanner is fetched and its checksum
      # verified HERE, before the version is derived and before setup-java imports the signing
      # key: a scanner that cannot be installed means "no release", never "release unscanned".
      # F-3: this is NOT "before the key is in scope" - the job declares `environment: release`,
      # so its environment secrets are bound to the job from the moment it is scheduled. It is
      # before the key is imported into a keyring, and no step from here to the gate names a
      # secret. This repository has no secret-free `preflight` job yet (QUESTIONS, separate
      # mechanism); when it lands, this step and the self-test below move into it.
      - name: Install the pinned Grype and verify its checksum
        run: tools/install-scanner.sh grype "${RUNNER_TEMP}/bin"

      - name: Derive the release version
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"      # refs/tags/v0.1.0 -> 0.1.0
          else
            version="${INPUT_VERSION}"
          fi
          # M4: a single whole-string bash `=~` test, not a line-oriented `grep -E`. `=~`
          # anchors ^ and $ to the whole string and `.` never matches a newline, so a
          # version containing an embedded newline (e.g. from `gh workflow run -f
          # version=$'0.1.0\nmalicious=1'`, which a single-line web form cannot express but
          # the REST API and `gh` can) is rejected outright instead of matching on one line
          # and injecting extra lines into $GITHUB_OUTPUT. Keep the -SNAPSHOT `case` as a
          # second belt: `case` also matches the whole string.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a semver release version"; exit 1
          fi
          case "$version" in
            *-SNAPSHOT) echo "::error::refusing to release a SNAPSHOT version ($version)"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Reproducible builds: every archive entry is stamped with the committer date
          # of the commit being released, so the same commit always yields the same bytes.
          echo "timestamp=$(scripts/git-commit-timestamp.sh)" >> "$GITHUB_OUTPUT"
          echo "releasing $version at $(scripts/git-commit-timestamp.sh)"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # No cache here (M3). actions/setup-java's maven cache also restores
          # ~/.m2/wrapper/dists, and mvnw execs an already-unpacked distribution there
          # with no checksum check at all (distributionSha256Sum is only verified against
          # the downloaded zip). A release build must not restore state it did not verify:
          # this is the job that holds the signing key and the Central token, and it must
          # start from nothing it did not just fetch and check itself. Left in ci.yml and
          # sample-smoke, which sign nothing.
          # Writes ~/.m2/settings.xml with <server><id>central</id> whose username and
          # password are read from the two environment variables named below. The values
          # never appear in the file, only the variable names.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          # Imports the signing key into a throwaway keyring and removes it in the post step.
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # M3: guarantee there is no unpacked Maven distribution left from any earlier state
      # of this runner for mvnw to exec unverified, on top of the missing cache above.
      - name: Remove any pre-existing Maven wrapper distribution
        run: rm -rf ~/.m2/wrapper/dists

      - name: Set the release version in the checkout
        # M3: an empty, local-to-the-job repository. The release job must not resolve
        # a single artifact from state it did not just download and verify itself.
        run: |
          set -euo pipefail
          ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -Dmaven.repo.local="${{ runner.temp }}/m2repo" \
            -DnewVersion="${{ steps.v.outputs.version }}" \
            -DprocessAllModules=true -DgenerateBackupPoms=false
          grep -n '<version>${{ steps.v.outputs.version }}</version>' pom.xml

      - name: Reproducibility check (two clean builds, identical jars)
        env:
          # N6: this step overrides MAVEN_OPTS (to add the empty local repo path), which
          # would otherwise silently drop the job-level info-log-level pin above - keep it
          # appended so the pin holds for every step in this job, not just the ones that
          # never redeclare MAVEN_OPTS.
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/m2repo -Dorg.slf4j.simpleLogger.defaultLogLevel=info
          # L1: written outside target/, which `clean deploy` below is about to wipe and
          # rebuild a third time. This is what the post-deploy step compares against.
          REPRODUCIBLE_SHA_FILE: ${{ runner.temp }}/reproducible-sha256.txt
        run: scripts/verify-reproducible.sh

      # The release half of the keyless CVE gate (2026-09-16). It runs HERE - after the
      # reproducibility check, which leaves the built jars in each module's target/, and BEFORE
      # the step that signs and uploads anything. A scan after the signature would be a report
      # about bytes that are already on their way to the Central Portal. The bundle itself cannot
      # be the input: central-publishing assembles central-bundle.zip during `deploy`, i.e. after
      # signing. The property "what is signed was scanned" is held instead by DIGEST BINDING: this
      # step writes scanned-sha256.txt, and the comparison step after the upload requires every
      # published jar entry in central-bundle.zip (javadoc excepted, below) to appear in it.
      #
      # Detection, not prevention (F-6): the binding is checked on a bundle that is already on the
      # Portal. A red comparison means the deployment is DROPPED on the Portal and never published;
      # the release runbook says so.
      #
      # SCANNED SET: the main jar and the sources jar of each published module, plus every jar of
      # the RESOLVED RUNTIME dependency set of those two modules (thin jars, not shaded ones -
      # scanning only our own two would scan almost nothing). Deliberately NOT in the set:
      #   * the sample (never published; a release held by an advisory in a demo dependency is how
      #     a gate gets switched off - the per-pull-request scan of the tree covers it);
      #   * `provided` and `optional` dependencies (the host supplies them: the starter's Spring
      #     dependencies are NOT scanned here);
      #   * the javadoc jars (F-2: they carry no runtime code and are not reproducible; the
      #     comparison step reports them and does not enforce them - a named, accepted residue).
      # POMS are not covered by jar digests: they are bound through the reproducibility record,
      # and the version check below refuses a published pom whose dependency versions could resolve
      # to something that was not scanned (F-4).
      #
      # Threshold and failure semantics are the pull-request job's, to the letter: the same
      # tools/check-vulnerability-report.py, --fail-on high, exit 2 on an unreadable report. MEDIUM
      # and below do not fail the release; they are written to the step summary and to
      # vulnerabilities-below-threshold.txt, and the release notes carry a decision for each
      # (the maintainer's documented duty, not something a script decides).
      - name: Self-test the severity gate before it is trusted
        run: |
          set -euo pipefail
          tools/check-vulnerability-report.py --self-test

      - name: Scan the artifacts this release is about to sign
        id: vulnscan
        env:
          MAVEN_OPTS: -Dmaven.repo.local=${{ runner.temp }}/m2repo -Dorg.slf4j.simpleLogger.defaultLogLevel=info
        run: |
          set -euo pipefail
          scan="${RUNNER_TEMP}/release-scan"

          # F-4: the scanned graph must be the consumer's graph. A consumer resolves from the
          # PUBLISHED pom; this step resolves on the runner. They diverge if a published pom
          # carries a version range, a SNAPSHOT, LATEST or RELEASE (Maven's two meta-versions,
          # matched as whole values: "1.0.RELEASE" is an ordinary pinned version), whether written
          # directly or through a property of the same pom. Refuse before building anything.
          python3 - pom.xml agent-guard-core/pom.xml agent-guard-spring-boot-starter/pom.xml <<'PY'
          import re, sys
          import xml.etree.ElementTree as ET

          floating = re.compile(r"[\[\]()]|-SNAPSHOT")
          bad = 0
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for el in root.iter():
                  el.tag = el.tag.split("}", 1)[-1]
              props_el = root.find("properties")
              props = {} if props_el is None else {c.tag: (c.text or "").strip() for c in props_el}

              def resolve(v):
                  for _ in range(10):
                      m = re.search(r"\$\{([^}]+)\}", v)
                      if m is None or m.group(1) not in props:
                          break
                      v = v.replace(m.group(0), props[m.group(1)])
                  return v

              for el in root.iter():
                  if el.tag not in ("dependency", "parent"):
                      continue
                  ver = el.find("version")
                  if ver is None or ver.text is None:
                      continue
                  raw = ver.text.strip()
                  v = resolve(raw)
                  if floating.search(v) or v in ("LATEST", "RELEASE"):
                      gid = (el.findtext("groupId") or "?").strip()
                      aid = (el.findtext("artifactId") or "?").strip()
                      print(f"::error::{path}: {el.tag} {gid}:{aid} has a floating, unpinned version '{raw}' (resolves to '{v}'): a consumer could resolve an artifact this release never scanned (version range, SNAPSHOT, LATEST or RELEASE)")
                      bad = 1
          sys.exit(bad)
          PY

          # D15-02: the reference for "the bytes this release signs" is the record the
          # reproducibility check wrote, NOT whatever is in target/ at this moment - target/ is
          # a directory this step's own inner build writes to, so a jar compared against it is
          # only ever compared against itself. That record is also what the post-deploy step
          # compares the uploaded bundle against, so binding the scan to it binds the scan, the
          # proved build and the upload to one set of bytes.
          record="${RUNNER_TEMP}/reproducible-sha256.txt"
          rm -rf "$scan"; mkdir -p "$scan"
          [ -f "$record" ] || { echo "::error::no checksum record from the reproducibility check; a scan that cannot be bound to the artifacts being signed is not evidence"; exit 1; }
          # The published jars, exactly as the reproducibility check just built them. Javadoc
          # jars are not scanned (F-2).
          for module in agent-guard-core agent-guard-spring-boot-starter; do
            found=0
            for jar in "$module"/target/*.jar; do
              [ -f "$jar" ] || continue
              case "$jar" in *-javadoc.jar) continue ;; esac
              cp "$jar" "$scan/"; found=1
            done
            [ "$found" -eq 1 ] || { echo "::error::no jar in $module/target to scan"; exit 1; }
          done

          # D15-01, D15-03: every jar of ours in the scan set must be, byte for byte, an artifact
          # the reproducibility check recorded - checked over BOTH published modules and over
          # every recorded jar, with an absent jar a refusal rather than a skipped iteration.
          # Called twice: once on what was staged above, and once after copy-dependencies, which
          # writes our own coordinates into the same directory and is the path a
          # repository-fetched same-version artifact would arrive by.
          assert_scan_set_is_the_recorded_build() { # <when>
            local when="$1" name expected actual rc=0 f
            while read -r expected name _; do
              [ -n "${name:-}" ] || continue
              case "$name" in *.jar) ;; *) continue ;; esac
              case "$name" in *-javadoc.jar) continue ;; esac
              if [ ! -f "$scan/$name" ]; then
                echo "::error::$name was built and recorded for this release but is not in the scan set ($when): the scan does not cover what is about to be signed"
                rc=1; continue
              fi
              actual="$(shasum -a 256 "$scan/$name" | cut -d' ' -f1)"
              [ "$expected" = "$actual" ] && continue
              echo "::error::$name in the scan set ($when) is not the artifact the reproducibility check recorded: $expected vs $actual. Either target/ was rewritten after the check, or this coordinate was resolved from a repository instead of from the reactor"
              rc=1
            done < "$record"
            # And the other direction, for our group only: a jar of ours in the scan set that the
            # reproducibility check never recorded is an artifact nobody proved.
            for f in "$scan"/agent-guard-*.jar; do
              [ -e "$f" ] || continue
              name="$(basename "$f")"
              if ! awk -v n=" $name" 'index($0, n) { found=1 } END { exit !found }' "$record"; then
                echo "::error::$name is in the scan set ($when) but was never recorded by the reproducibility check"
                rc=1
              fi
            done
            return "$rc"
          }
          assert_scan_set_is_the_recorded_build "staged from target/"

          # Every jar a host actually gets at runtime, for the two PUBLISHED modules only.
          #
          # `package` runs in the SAME invocation as copy-dependencies on purpose (F-5; release run
          # 35922939487 on the sibling module): the starter depends on com.housedevinci:agent-guard-core
          # at the release version, which at this point exists nowhere but this reactor - not in the
          # job's empty local repository and not on Central. A bare `dependency:copy-dependencies`
          # would ask Central for it and fail the release. Packaging the selected modules first inside
          # one session makes Maven resolve the sibling from the reactor's own target/ jar. -am pulls
          # in the parent pom project for the same reason.
          #
          # Same profile, same timestamp and same test setting as the reproducibility check's
          # builds (D15-02): an inner build with the pom's default timestamp would rewrite
          # target/ with bytes nobody proved, and the assertion below would then - correctly -
          # refuse the release.
          ./mvnw -B -q -Prelease -Dgpg.skip=true -DskipTests \
            -Dproject.build.outputTimestamp="${{ steps.v.outputs.timestamp }}" \
            package dependency:copy-dependencies \
            -pl agent-guard-core,agent-guard-spring-boot-starter -am \
            -Dmaven.repo.local="${{ runner.temp }}/m2repo" \
            -DincludeScope=runtime -DoutputDirectory="$scan"
          assert_scan_set_is_the_recorded_build "after the dependency copy"
          count="$(find "$scan" -name '*.jar' | wc -l | tr -d ' ')"
          echo "scanning $count jar(s)"
          [ "$count" -gt 0 ] || { echo "::error::nothing to scan; refusing to call that clean"; exit 1; }
          # The digest of every scanned jar: the gate requires the scanner to have walked each one
          # (--expect-digests), and the comparison step after the upload requires every published
          # jar entry in the bundle to be in this file (the binding between scanned and signed
          # bytes). "98 jars were staged" and "98 jars were opened by the scanner" are different
          # statements, and only the second one is a scan.
          find "$scan" -name '*.jar' -print0 | xargs -0 shasum -a 256 > "${RUNNER_TEMP}/scanned-sha256.txt"
          set +e
          # TWO documents out of ONE invocation (release run 36048639931 on the sibling module).
          # grype's JSON report has four top-level keys - matches, source, distro, descriptor -
          # and lists what it scanned in none of them; "artifacts" is syft's key. The CycloneDX
          # document of the same run carries the catalog: one library component per package and one
          # file component, with a SHA-256, per file walked.
          "${RUNNER_TEMP}/bin/grype" "dir:$scan" \
            -o json="${RUNNER_TEMP}/grype.json" \
            -o cyclonedx-json="${RUNNER_TEMP}/grype-sbom.json"
          rc=$?
          set -e
          # grype exits 0 when it completed; with no --fail-on it does not use the exit code
          # to report findings, so anything non-zero here is a scanner failure.
          if [ "$rc" -ne 0 ]; then
            echo "::error::grype exited $rc: the scan did not complete, so this release cannot claim its artifacts were scanned"
            exit 1
          fi
          # --min-artifacts and --expect-digests are the coverage half of the gate: fewer
          # packages than jars staged, or one staged jar the scanner never opened, is exit 2.
          tools/check-vulnerability-report.py \
            --format grype --report "${RUNNER_TEMP}/grype.json" \
            --sbom "${RUNNER_TEMP}/grype-sbom.json" \
            --min-artifacts "$count" \
            --expect-digests "${RUNNER_TEMP}/scanned-sha256.txt" \
            --fail-on high \
            --summary-file "${RUNNER_TEMP}/vulnerabilities-below-threshold.txt" \
            | tee "${RUNNER_TEMP}/vulnscan-gate.txt"
          {
            echo "### Vulnerability scan of the artifacts about to be signed"
            echo
            echo "$count jar(s) staged; coverage reported by the gate:"
            echo
            { grep -E 'were scanned|matched by digest' "${RUNNER_TEMP}/vulnscan-gate.txt" || echo "the gate printed no coverage line"; } | sed 's/^/- /'
            echo
            echo "#### Vulnerabilities below the release threshold"
            echo
            if [ -s "${RUNNER_TEMP}/vulnerabilities-below-threshold.txt" ]; then
              cat "${RUNNER_TEMP}/vulnerabilities-below-threshold.txt"
              echo
              echo "Each line needs a decision in the release notes before Publish is pressed."
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One Maven invocation runs the whole release lifecycle in order:
      #   test -> spotless -> jacoco gate -> licence allowlist + THIRD-PARTY-NOTICES.txt
      #        -> sources + javadoc jars -> GPG signatures -> Central Portal upload.
      # It stops at "validated": the deployment waits for a human on the portal.
      # -Dmaven.repo.local (M3): empty at the start of this step, same reasoning as above.
      # -C / --strict-checksums (M3): fail rather than silently accept an artifact whose
      # checksum does not match what the remote repository published.
      - name: Verify, licence check, sign, upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B -C clean deploy -Prelease \
            -Dmaven.repo.local="${{ runner.temp }}/m2repo" \
            -Dproject.build.outputTimestamp="${{ steps.v.outputs.timestamp }}"

      # L5: agent-guard-sample is the last module in the reactor, so it is the module that
      # assembles and uploads the aggregate bundle. <excludeArtifacts> in the release
      # profile is the only mechanism keeping the sample's own coordinates out of it; a
      # silent regression there (or in a future plugin version) would upload the wrong
      # bundle, or nothing, while still reporting success. Fail loudly instead: the bundle
      # must contain exactly the three published coordinates and never the sample.
      - name: Confirm the bundle contains exactly the three published coordinates
        if: success()
        run: |
          set -euo pipefail
          # N4: central-publishing-maven-plugin assembles the aggregate bundle in the
          # TOP-LEVEL project's build directory, not the last reactor module's. The previous
          # path here (agent-guard-sample/target/...) was never written by the plugin, so
          # this step failed with "was not created" on every release run - after the upload
          # had already happened - and the two steps after it (L1's checksum comparison,
          # L4's evidence upload, both `if: success()`) never ran. Reproduced with a real
          # `deploy -Prelease`: the bundle lands at ./target/central-publishing/central-bundle.zip.
          # Not a glob/find: a `find`-based lookup would silently pass on a stale bundle from
          # an earlier module.
          bundle="target/central-publishing/central-bundle.zip"
          [ -f "$bundle" ] || { echo "::error::$bundle was not created"; exit 1; }
          listing="$(unzip -l "$bundle")"
          echo "$listing"
          if printf '%s' "$listing" | grep -q 'agent-guard-sample'; then
            echo "::error::the bundle contains agent-guard-sample, which must never be published"
            exit 1
          fi
          for coord in agent-guard-parent agent-guard-core agent-guard-spring-boot-starter; do
            if ! printf '%s' "$listing" | grep -q "com/housedevinci/${coord}/"; then
              echo "::error::the bundle is missing $coord"
              exit 1
            fi
          done

      # L1, as amended: compare the bytes that were UPLOADED, entry by entry, against the
      # checksums the reproducibility check recorded - not the jars left lying in each
      # module's target/. Those files are a sibling of the bundle, not the bundle: a step that
      # compares them proves something about the build directory and nothing about what
      # Sonatype received. central-bundle.zip is the artifact that went over the wire, so the
      # comparison reads the jars out of it.
      #
      # Since the pre-sign scan landed it also asserts that every non-javadoc jar in the bundle was
      # scanned (scanned-sha256.txt, by digest); see the comment above the scan step.
      #
      # This necessarily lands AFTER the upload - signing happens at verify and the upload at
      # deploy. That is why it is not the whole control: the release runbook states that
      # Publish is pressed only on a green run, and that a red comparison means the deployment
      # is DROPPED on the Portal, never published. A red run leaves a bundle that no human
      # should ever release, and this step is what tells them so.
      #
      # Every jar AND pom recorded by the reproducibility check must be present in the
      # bundle, and every jar or pom in the bundle must have been recorded: a missing
      # artifact and an extra one are both failures. Poms are compared too, not only jars
      # (RP-5): Central consumes the pom bytes, and the window this check exists to close
      # applies to them identically. Javadoc jars are reported and not enforced (javadoc
      # embeds JDK build detail that -notimestamp does not remove; Central requires the
      # jar, nobody diffs one).
      - name: Confirm the uploaded bundle matches the reproducibility check
        if: success()
        run: |
          set -euo pipefail
          sha_file="${{ runner.temp }}/reproducible-sha256.txt"
          bundle="target/central-publishing/central-bundle.zip"
          [ -f "$bundle" ] || { echo "::error::$bundle was not created"; exit 1; }
          [ -f "$sha_file" ] || { echo "::error::no checksum file from the reproducibility check"; exit 1; }
          scanned_file="${{ runner.temp }}/scanned-sha256.txt"
          [ -f "$scanned_file" ] || { echo "::error::no scanned-sha256.txt from the pre-sign scan: nothing binds the bundle to what was scanned"; exit 1; }

          work="${{ runner.temp }}/bundle-contents"
          rm -rf "$work"; mkdir -p "$work"
          unzip -q "$bundle" -d "$work"

          status=0
          {
            echo "### Uploaded bundle vs. the reproducibility check"
            echo
            printf '| %s | %s | %s |\n' "bundle entry" "verdict" "sha256"
            printf '|---|---|---|\n'
          } >>"$GITHUB_STEP_SUMMARY"

          seen="${{ runner.temp }}/bundle-jars-seen.txt"
          : > "$seen"
          while IFS= read -r jar; do
            name="$(basename "$jar")"
            echo "$name" >> "$seen"
            # RP-6: an entry with no recorded checksum (the un-recorded parent pom, before
            # the collect() fix) must report NO RECORD and let the loop continue to the
            # next entry, never kill the step here. `grep -F ... | awk ...` under
            # set -euo pipefail did exactly that: grep's exit 1 (no match) was promoted by
            # pipefail to the assignment's status, and set -e killed the step at this line,
            # silently, before the NO RECORD branch below could ever run - which is also
            # why every entry sorted after the missing one (alphabetically, the starter's
            # jars and pom) was never compared either. awk alone, exiting 0 whether or not
            # it finds a match, cannot kill the step.
            expected="$(awk -v n=" $name" 'index($0, n) { print $1; exit }' "$sha_file")"
            actual="$(shasum -a 256 "$jar" | cut -d' ' -f1)"
            entry="${jar#$work/}"
            # Binding between scanned and signed bytes (design F-1/F-2): every published jar entry
            # must appear in scanned-sha256.txt BY DIGEST. Exempt: poms (bound through the
            # reproducibility record; a pom is not a scanned artifact) and jars whose name ends in
            # exactly `-javadoc.jar` (a named, accepted residue: no runtime code, not reproducible,
            # not scanned). Nothing else is exempt: `-javadocX.jar` is a jar like any other.
            case "$name" in
              *.jar)
                case "$name" in
                  *-javadoc.jar) ;;
                  *)
                    if ! awk -v d="$actual" '$1 == d { found=1 } END { exit !found }' "$scanned_file"; then
                      echo "::error::$entry is in the uploaded bundle but its digest is not in scanned-sha256.txt: these bytes were never scanned"
                      printf '| %s | %s | %s |\n' "$entry" "UNSCANNED" "$actual" >>"$GITHUB_STEP_SUMMARY"
                      status=1
                    fi
                    ;;
                esac
                ;;
            esac
            if [ -z "$expected" ]; then
              echo "::error::$entry is in the uploaded bundle but has no recorded checksum from the reproducibility check"
              printf '| %s | %s | %s |\n' "$entry" "NO RECORD" "$actual" >>"$GITHUB_STEP_SUMMARY"
              status=1
            elif [ "$expected" = "$actual" ]; then
              printf '| %s | %s | %s |\n' "$entry" "matches" "$actual" >>"$GITHUB_STEP_SUMMARY"
            else
              case "$name" in
                *-javadoc.jar)
                  echo "::warning::$entry differs from the reproducibility check (not enforced: the javadoc jar is not diffed)"
                  printf '| %s | %s | %s |\n' "$entry" "differs (not enforced)" "$actual" >>"$GITHUB_STEP_SUMMARY"
                  ;;
                *)
                  echo "::error::$entry does not match its reproducibility-check checksum: $expected vs $actual"
                  printf '| %s | %s | %s |\n' "$entry" "MISMATCH" "$actual" >>"$GITHUB_STEP_SUMMARY"
                  status=1
                  ;;
              esac
            fi
          done < <(find "$work" \( -name '*.jar' -o -name '*.pom' \) -type f | sort)

          # The other direction: a jar the reproducibility check proved must not be missing
          # from what was uploaded.
          while read -r _ name _; do
            [ -n "${name:-}" ] || continue
            if ! grep -qxF "$name" "$seen"; then
              echo "::error::$name was checked for reproducibility but is not in the uploaded bundle"
              printf '| %s | %s | %s |\n' "$name" "MISSING FROM BUNDLE" "-" >>"$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done < "$sha_file"

          exit "$status"

      # F-7: the scan's evidence is copied out of the runner temp directory into the workspace,
      # whatever happened before, so that the uploads below can address it: a refusal leaves the
      # report that caused it. scanned-sha256.txt is the file that carries the binding between
      # what was scanned and what was uploaded; vulnerabilities-below-threshold.txt is what the
      # release notes' MEDIUM decisions are copied from.
      - name: Collect the scan evidence
        if: always()
        run: |
          mkdir -p release-evidence
          for f in grype.json grype-sbom.json scanned-sha256.txt vulnerabilities-below-threshold.txt vulnscan-gate.txt; do
            if [ -f "${{ runner.temp }}/$f" ]; then cp "${{ runner.temp }}/$f" "release-evidence/$f"; fi
          done

      # L4: signing happens at `verify`, the Portal upload after; a run that fails at
      # upload must not still hand out a downloadable artifact with a valid signature for
      # a version that was never actually published and may never be. Jars and .asc only
      # when the run actually succeeded; on failure, only the evidence that helps diagnose
      # why, named so it cannot be mistaken for a real release artifact.
      - name: Upload the release evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.v.outputs.version }}
          path: |
            **/target/THIRD-PARTY-NOTICES.txt
            agent-guard-core/target/*.jar
            agent-guard-core/target/*.asc
            agent-guard-spring-boot-starter/target/*.jar
            agent-guard-spring-boot-starter/target/*.asc
            release-evidence/grype.json
            release-evidence/grype-sbom.json
            release-evidence/scanned-sha256.txt
            release-evidence/vulnerabilities-below-threshold.txt
            release-evidence/vulnscan-gate.txt
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.v.outputs.version }}-FAILED
          path: |
            **/target/THIRD-PARTY-NOTICES.txt
            **/target/surefire-reports/**
            release-evidence/grype.json
            release-evidence/grype-sbom.json
            release-evidence/scanned-sha256.txt
            release-evidence/vulnerabilities-below-threshold.txt
            release-evidence/vulnscan-gate.txt
          if-no-files-found: ignore

  sample-smoke:
    # RELEASE-PROCESS.md step 6: the sample app is re-run from a clean clone and timed.
    # This job shares nothing with the publish job: fresh checkout, fresh container,
    # the artifacts it uses are the ones it just built from source.
    name: Sample app from a clean clone
    runs-on: ubuntu-latest
    steps:
      # L3: this job never talks to git after checkout either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Start PostgreSQL, build, run, time to first response
        working-directory: agent-guard-sample
        run: |
          set -euo pipefail
          start=$(date +%s)

          docker compose up -d
          # Build the sample and the two libraries it needs. Tests already ran in CI;
          # this job measures how long a newcomer waits, not whether the tests pass.
          (cd .. && ./mvnw -B -q -DskipTests -Dspotless.check.skip=true -Djacoco.skip=true \
              -pl agent-guard-sample -am package)

          java -jar target/agent-guard-sample-*.jar > /tmp/sample.log 2>&1 &
          app=$!

          # "Running" = the approval endpoint answers. 401 is a correct answer: the app is
          # up and Spring Security is refusing an unauthenticated caller.
          ready=""
          for _ in $(seq 1 120); do
            if ! kill -0 "$app" 2>/dev/null; then
              echo "::error::the sample exited before it answered"; tail -50 /tmp/sample.log; exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/agentguard/audit || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          end=$(date +%s)
          elapsed=$(( end - start ))

          if [ -z "$ready" ]; then
            echo "::error::the sample never answered"; tail -80 /tmp/sample.log; kill "$app" || true; exit 1
          fi

          echo "sample reached a first response in ${elapsed}s (clone -> running)"
          echo "### Sample: running in ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

          kill "$app" || true

          # The target is under two minutes on a developer machine. A GitHub runner is
          # slower and starts a PostgreSQL container from scratch, so the gate here is three
          # minutes; the number above is the one that goes in the release notes.
          if [ "$elapsed" -gt 180 ]; then
            echo "::error::sample took ${elapsed}s, over the 180s CI budget"; exit 1
          fi

      - name: PostgreSQL down
        if: always()
        working-directory: agent-guard-sample
        run: docker compose down -v
