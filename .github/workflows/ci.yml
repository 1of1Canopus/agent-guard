name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # F7: CONTRIBUTING.md now requires every commit in a pull request to carry a DCO
  # "Signed-off-by:" trailer (git commit -s). This is the only enforcement of that
  # requirement - nothing rejects an unsigned commit at merge time otherwise. Runs only on
  # pull_request, where github.event.pull_request.base.sha / .head.sha give an exact commit
  # range; a plain push to main (already reviewed, already merged) is not re-checked.
  #
  # GRANDFATHER_SHA: this requirement is adopted mid-flight, on PR #9, which already carries
  # commits pushed before CONTRIBUTING.md asked for a sign-off. Those commits cannot gain a
  # trailer without rewriting already-pushed history, which this project's git rules forbid
  # (no force-push, ever - see AGENTS.md/CLAUDE.md "Never force-push"). ddd250c is the last
  # commit made before this exemption was added; a commit is exempt only if it IS ddd250c or
  # an ANCESTOR of it. That makes the exemption self-limiting: once this PR merges, ddd250c
  # becomes part of main's history, and every commit on every future branch is a DESCENDANT
  # of it, never an ancestor - so `git merge-base --is-ancestor <sha> ddd250c` is false for
  # any commit that did not already exist before this line was written, and no future
  # contribution is ever grandfathered by accident. Full reasoning: QUESTIONS.md #29.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify every commit in this pull request is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GRANDFATHER_SHA: ddd250c3d0fbdf67fb6cea8d3acb583c3b07de43
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            if git cat-file -e "$GRANDFATHER_SHA" 2>/dev/null \
                && git merge-base --is-ancestor "$sha" "$GRANDFATHER_SHA"; then
              continue
            fi
            subject="$(git log -1 --format='%s' "$sha")"
            # G2: a merge commit is exempt because it has two-or-more parents (%P), never
            # because of its subject - a subject is free text the committer chooses, and an
            # ordinary single-parent commit titled "Merge branch 'x' into y" used to be
            # exempted from the sign-off requirement with no trailer at all. Parent count
            # cannot be forged the way a commit message can.
            case "$(git log -1 --format='%P' "$sha")" in
              *' '*) continue ;;   # two or more parents: a real merge commit
            esac
            if ! git log -1 --format='%B' "$sha" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha (\"$subject\") has no 'Signed-off-by:' trailer - see CONTRIBUTING.md, git commit -s"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing commit(s) missing a DCO sign-off"
            exit 1
          fi
          echo "all commits in ${BASE_SHA}..${HEAD_SHA} are signed off"

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker: Testcontainers starts PostgreSQL and Redis for the integration tests.
      - name: Build, test, format check, coverage gate, third-party notices
        run: ./mvnw -B clean verify
      - name: Upload third-party notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: "**/target/THIRD-PARTY-NOTICES.txt"
