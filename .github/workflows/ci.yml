name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # F7: CONTRIBUTING.md now requires every commit in a pull request to carry a DCO
  # "Signed-off-by:" trailer (git commit -s). This is the only enforcement of that
  # requirement - nothing rejects an unsigned commit at merge time otherwise. Runs only on
  # pull_request, where github.event.pull_request.base.sha / .head.sha give an exact commit
  # range; a plain push to main (already reviewed, already merged) is not re-checked.
  #
  # The GRANDFATHER_SHA exemption that used to live here grandfathered
  # PR #9's own pre-rule commits and was proven self-limiting: once PR #9 merged into main,
  # ddd250c became part of main's history, so every commit on every future branch is a
  # DESCENDANT of it, never an ancestor, and the exemption could never match a new commit
  # again. Removed now that PR #9 is on main - see G2 (this PR).
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify every commit in this pull request is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            subject="$(git log -1 --format='%s' "$sha")"
            # G2: a merge commit is exempt because it has two-or-more parents (%P), never
            # because of its subject - a subject is free text the committer chooses, and an
            # ordinary single-parent commit titled "Merge branch 'x' into y" used to be
            # exempted from the sign-off requirement with no trailer at all. Parent count
            # cannot be forged the way a commit message can.
            # G3: parent count alone is too broad - a merge commit's tree is not constrained
            # by its parents, so an octopus merge or a two-parent commit whose second parent
            # is not from the base can carry authored content ("evil merge") that exists in
            # no parent, while still being waved through as "a real merge". Exempt a merge
            # only when it is a trivial back-merge of the base: exactly two parents, the
            # second an ancestor of BASE_SHA, and the commit's own tree identical to the tree
            # git itself computes for merging those two parents (git merge-tree, needs
            # git >= 2.38; ubuntu-latest is well past it). An octopus, a two-parent commit
            # whose second parent is not from the base, and any merge carrying an evil-merge
            # delta all fall through to the sign-off requirement.
            # G4: git merge-tree --write-tree exits non-zero when the merge it computes has a
            # conflict, even though it still writes a tree. Under set -euo pipefail that
            # would kill this step outright before the sign-off check ever ran. Guard the
            # substitution in an if so errexit skips it on that path: auto stays empty, the
            # exempt check fails, and a conflict-resolution merge (which is authored content)
            # correctly falls through to the sign-off requirement below, with a visible error.
            parents="$(git log -1 --format='%P' "$sha")"
            set -- $parents
            if [ "$#" -ge 2 ]; then
              exempt=0
              if [ "$#" -eq 2 ] && git merge-base --is-ancestor "$2" "$BASE_SHA" 2>/dev/null; then
                auto=""
                if merged="$(git merge-tree --write-tree "$1" "$2" 2>/dev/null)"; then
                  auto="$(printf '%s\n' "$merged" | head -1)"
                fi
                own="$(git rev-parse "$sha^{tree}")"
                [ -n "$auto" ] && [ "$auto" = "$own" ] && exempt=1
              fi
              [ "$exempt" -eq 1 ] && continue
            fi
            if ! git log -1 --format='%B' "$sha" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha (\"$subject\") has no 'Signed-off-by:' trailer - see CONTRIBUTING.md, git commit -s"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing commit(s) missing a DCO sign-off"
            exit 1
          fi
          echo "all commits in ${BASE_SHA}..${HEAD_SHA} are signed off"

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker: Testcontainers starts PostgreSQL and Redis for the integration tests.
      - name: Build, test, format check, coverage gate, third-party notices
        run: ./mvnw -B clean verify
      - name: Upload third-party notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: "**/target/THIRD-PARTY-NOTICES.txt"

  # N12: tools/cipher-probe-release-pipeline.sh used to be run only by hand. That is the
  # mechanical reason N6 reached a tagged release - the suite that would have caught it was
  # never executed by CI on the branch that broke it. Run it on every push and pull request,
  # unconditionally: no `continue-on-error`, no `if:` that can skip it. The script already
  # exits 1 when any probe is weak.
  cipher-probes:
    name: Cipher probes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker; CIPHER_PROBE_MAVEN=1 runs the two probes that shell out
      # to the pinned Maven wrapper.
      - name: Run the the security review probe suite
        run: CIPHER_PROBE_MAVEN=1 tools/cipher-probe-release-pipeline.sh

  # Keyless CVE gate, pull-request half. OSV-Scanner reads the real, transitively resolved
  # dependency graph of every pom in the tree (deps.dev's resolver, not a text match on the
  # poms) and writes a JSON report; the threshold that decides whether this build fails is
  # NOT the scanner's exit code but tools/check-vulnerability-report.py, which both this job
  # and the release use, so the gate before a release cannot be quietly weaker than the gate
  # before a merge.
  #
  # Fail closed on both halves: the scanner exiting anything other than "clean" (0) or
  # "findings" (1) fails the job, and so does an empty or unparseable report. "We could not
  # scan" is not "there is nothing there" - that includes exit 128, "no packages found",
  # which for this tree can only mean the resolution did not happen.
  #
  # Offline behaviour, stated rather than discovered: this job needs the network twice, once
  # to fetch the pinned scanner from its release page and once for deps.dev. Either failing
  # fails the job. There is no offline mode and no cached-database fallback, because a stale
  # database is the failure mode a CVE gate exists to prevent - an advisory published
  # yesterday is exactly the one this check is for.
  #
  # The scanner is installed by tools/install-scanner.sh at a pinned version verified against
  # a checksum recorded in the repository, rather than through the vendor's Action: that
  # Action is a Docker action whose image reference is a mutable tag, so pinning its commit
  # sha would pin the YAML and not the scanner. See the script's header.
  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the severity gate (CVSS arithmetic, report parsing, unrated handling)
        run: tools/check-vulnerability-report.py --self-test
      - name: Install the pinned OSV-Scanner and verify its checksum
        run: tools/install-scanner.sh osv-scanner "${RUNNER_TEMP}/bin"
      # Every pom is named explicitly, and the resolver is pointed at Maven Central rather than
      # at deps.dev. Both were learned by running it: a recursive scan of this tree exits 127
      # ("failed resolution") because deps.dev does not know this repository's own SNAPSHOT
      # modules, nor every AWS SDK artifact the optional S3 store pulls in. With the native
      # resolver those unresolvable coordinates are reported as "local/unscannable" and skipped,
      # and everything a host actually downloads is resolved and scanned.
      - name: Scan the resolved dependency graph
        run: |
          set -uo pipefail
          "${RUNNER_TEMP}/bin/osv-scanner" scan source \
            --data-source=native --maven-registry=https://repo.maven.apache.org/maven2 \
            --all-packages \
            --format json --output-file "${RUNNER_TEMP}/osv.json" \
            -L pom.xml:pom.xml \
            -L pom.xml:agent-guard-core/pom.xml \
            -L pom.xml:agent-guard-spring-boot-starter/pom.xml \
            -L pom.xml:agent-guard-sample/pom.xml
          rc=$?
          # 0: scanned, nothing found. 1: scanned, findings - the severity step decides.
          # Anything else (127 error, 128 no packages found) means the scan did not happen.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::osv-scanner exited $rc: the scan did not complete, so this check cannot say the dependencies are clean"
            exit 1
          fi
      - name: Fail on a known HIGH or CRITICAL vulnerability
        run: |
          tools/check-vulnerability-report.py \
            --format osv --report "${RUNNER_TEMP}/osv.json" --fail-on high
      - name: Upload the vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report
          path: ${{ runner.temp }}/osv.json
          if-no-files-found: warn
