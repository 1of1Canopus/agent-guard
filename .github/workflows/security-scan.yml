name: Security scan

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP Dependency-Check (fails on CVSS >= 7)
        run: ./mvnw -B -Psecurity-scan -DskipTests -Dnvd.api.key=${{ secrets.NVD_API_KEY }} verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: "**/target/dependency-check-report.*"
