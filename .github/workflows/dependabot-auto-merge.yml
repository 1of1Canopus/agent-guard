name: Dependabot auto-merge

# Explicit, maintainer-approved exception to "a person merges every PR": a Dependabot PR
# merges itself when every condition below holds, and never otherwise.
#
# Two kinds of stop. A refusal is a `::notice::` and exit 0: the PR waits for a person, like
# any other Dependabot PR. An error (a failed disarm, an unexpected arm failure) is red on
# purpose, because a run that could not decide must not look like one that did.
#
# `gh pr merge --auto` arms the merge when the PR is not yet mergeable, and merges at once
# when it already is (GitHub CLI behaviour; the repository setting is not consulted on that
# path). So the setting is checked here, and the arm call carries --match-head-commit with
# the sha this run was raised for.
#
# A person cannot make this job succeed: a re-run keeps the actor but not the person who
# clicked, so the first step compares the triggering actor too. Recovery after a person
# pushes onto a Dependabot branch is `@dependabot rebase`, or a merge by hand.
#
# `pull_request`, never `pull_request_target`: this workflow's definition always comes
# from main, never from the PR branch, and it never checks out the PR head. All decision
# logic lives in shell, reading env vars, so each condition is a step body that can be
# extracted and run against a synthetic input outside the Actions runtime.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

# One run per PR at a time; a newer event cancels the older run, so a slow arm job cannot
# finish after a faster disarm job.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge a patch/minor Dependabot PR after review
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # No checkout: everything this job needs comes from the GitHub API.
      #
      # Provenance: this run must be the one Dependabot raised, for the head it is still at.
      - name: Refuse a re-run, a fork or a moved head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          refuse() { echo "::notice::refusing auto-merge: $1"; echo "STOP=1" >> "$GITHUB_ENV"; exit 0; }
          [ "$ACTOR" = "dependabot[bot]" ] || refuse "actor is not dependabot[bot]"
          [ "$TRIGGERING_ACTOR" = "dependabot[bot]" ] || refuse "run was started by '$TRIGGERING_ACTOR' (a re-run by a person)"
          [ "$PR_AUTHOR" = "dependabot[bot]" ] || refuse "PR author is not dependabot[bot]"
          [ "$HEAD_REPO" = "$REPO" ] || refuse "head repository is not this repository"
          case "$HEAD_REF" in dependabot/*) ;; *) refuse "head branch is not a dependabot/ branch" ;; esac
          live="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)" || refuse "could not read the live head"
          [ "$live" = "$HEAD_SHA" ] || refuse "head moved since this run was raised"

      # The repository setting is the real on/off switch (see the header).
      - name: Refuse while the repository does not allow auto-merge
        if: env.STOP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          refuse() { echo "::notice::refusing auto-merge: $1"; echo "STOP=1" >> "$GITHUB_ENV"; exit 0; }
          v="$(gh api "repos/${REPO}" --jq .allow_auto_merge)" || refuse "could not read the repository settings"
          [ "$v" = "true" ] || refuse "the repository setting 'Allow auto-merge' is not on"

      - name: Read the update metadata Dependabot left in the commit message
        id: metadata
        if: env.STOP != '1'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Condition 1: patch or minor only. Fail closed: anything other than exactly those
      # two values (major, unknown, empty) refuses. Dependabot security updates carry the
      # same update-type values, so they are covered by the same rule with no carve-out.
      - name: Refuse anything other than a patch or minor update
        if: env.STOP != '1'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -uo pipefail
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *)
              echo "::notice::refusing auto-merge: update-type is '$UPDATE_TYPE' (only patch and minor auto-merge; majors and security updates outside those two wait for a human)"
              echo "STOP=1" >> "$GITHUB_ENV"
              ;;
          esac

      # Condition 4: the PR changes only pom.xml files, as plain modifications. Renames are
      # refused (the old path counts), and the number of entries must equal the PR's own
      # changed_files count, so a truncated list cannot hide a file. Any API error refuses.
      - name: Refuse a PR that touches anything but a manifest
        if: env.STOP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          refuse() { echo "::notice::refusing auto-merge: $1"; echo "STOP=1" >> "$GITHUB_ENV"; exit 0; }
          changed="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .changed_files)" || refuse "could not read the PR"
          files="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv')" || refuse "could not read the changed files"
          [[ "$changed" =~ ^[0-9]+$ ]] || refuse "changed_files is not a number"
          [ "$changed" -ge 1 ] && [ "$changed" -le 50 ] || refuse "changed_files is $changed (allowed: 1 to 50)"
          count=0
          while IFS=$'\t' read -r status name prev; do
            [ -n "$name" ] || continue
            count=$((count + 1))
            [ "$status" = "modified" ] || refuse "file $name has status '$status' (only plain modifications)"
            [ -z "$prev" ] || refuse "file $name was renamed from $prev"
            case "$name" in
              pom.xml|*/pom.xml) ;;
              *) refuse "changed file outside the pom.xml allowlist: $name" ;;
            esac
          done <<<"$files"
          [ "$count" -eq "$changed" ] || refuse "file list has $count entries but the PR has $changed changed files"

      # Condition 5: the head commit is authored by dependabot[bot] with a verified
      # signature. A human pushing onto a Dependabot branch (to slip in an unrelated
      # change under cover of a dependency bump) disables auto-merge.
      - name: Refuse an unverified or non-Dependabot head commit
        if: env.STOP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          refuse() { echo "::notice::refusing auto-merge: $1"; echo "STOP=1" >> "$GITHUB_ENV"; exit 0; }
          commit="$(gh api "repos/${REPO}/commits/${HEAD_SHA}")" || refuse "could not read the head commit"
          author_login="$(printf '%s' "$commit" | jq -r '.author.login // empty')" || refuse "could not parse the head commit"
          verified="$(printf '%s' "$commit" | jq -r '.commit.verification.verified')" || refuse "could not parse the head commit"
          [ "$author_login" = "dependabot[bot]" ] || refuse "head commit author is '${author_login:-unknown}', not dependabot[bot]"
          [ "$verified" = "true" ] || refuse "head commit signature is not verified"

      # Condition 7: arming is refused unless every gate job of the repo's CI is a required
      # check on the target branch, at this moment. Gate jobs are read from ci.yml on the base
      # branch AND at the head sha (the union), with yq, so a job with no `name:` counts under
      # its id. A context counts as required only when the rule pins it to GitHub Actions
      # (integration_id 15368): a name-only context can be satisfied by any commit status.
      # The list is .github/required-checks.txt on the BASE branch. Any error refuses.
      - name: Refuse unless every CI gate job is a required check
        if: env.STOP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          refuse() { echo "::notice::refusing auto-merge: $1"; echo "STOP=1" >> "$GITHUB_ENV"; exit 0; }
          jobnames() { yq -r '.jobs | to_entries | .[] | (.value.name // .key)' <<<"$1"; }
          listed="$(gh api -H 'Accept: application/vnd.github.raw' "repos/${REPO}/contents/.github/required-checks.txt?ref=${BASE_REF}")" || refuse "could not read required-checks.txt on ${BASE_REF}"
          rules="$(gh api "repos/${REPO}/rules/branches/${BASE_REF}")" || refuse "could not read the branch rules"
          ci_base="$(gh api -H 'Accept: application/vnd.github.raw' "repos/${REPO}/contents/.github/workflows/ci.yml?ref=${BASE_REF}")" || refuse "could not read ci.yml on ${BASE_REF}"
          ci_head="$(gh api -H 'Accept: application/vnd.github.raw' "repos/${REPO}/contents/.github/workflows/ci.yml?ref=${HEAD_SHA}")" || refuse "could not read ci.yml at the head"
          required="$(printf '%s' "$rules" | jq -r '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[] | select(.integration_id == 15368) | .context' | sort -u)" || refuse "could not parse the branch rules"
          jobs_base="$(jobnames "$ci_base")" || refuse "could not parse ci.yml on ${BASE_REF}"
          jobs_head="$(jobnames "$ci_head")" || refuse "could not parse ci.yml at the head"
          jobs="$(printf '%s\n%s\n' "$jobs_base" "$jobs_head" | sed '/^$/d' | sort -u)"
          listed="$(printf '%s\n' "$listed" | sed -e '/^#/d' -e '/^$/d' | sort -u)"
          [ -n "$required" ] || refuse "the branch has no required status check pinned to GitHub Actions"
          [ -n "$listed" ] || refuse "required-checks.txt is empty"
          [ -n "$jobs_base" ] && [ -n "$jobs_head" ] || refuse "found no job in ci.yml"
          case "$jobs" in *'${{'*) refuse "a job name in ci.yml is an expression" ;; esac
          unlisted="$(comm -13 <(printf '%s\n' "$listed") <(printf '%s\n' "$jobs"))"
          [ -z "$unlisted" ] || refuse "CI job not in required-checks.txt: $(printf '%s' "$unlisted" | tr '\n' ',')"
          unrequired="$(comm -13 <(printf '%s\n' "$required") <(printf '%s\n' "$listed"))"
          [ -z "$unrequired" ] || refuse "listed check is not a required check pinned to GitHub Actions on ${BASE_REF}: $(printf '%s' "$unrequired" | tr '\n' ',')"

      # Condition 3 (every required check green) is enforced by GitHub's native auto-merge
      # itself, not by this workflow: `gh pr merge --auto` only completes the merge once
      # every required check on the branch protection ruleset is green, and does nothing
      # before that. This job does not poll checks; it only decides whether the PR is
      # ALLOWED to wait for them with auto-merge armed.
      - name: Enable auto-merge
        id: arm
        if: env.STOP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          echo "::notice::update-type ${UPDATE_TYPE:-unknown}, pom-only, verified Dependabot commit: arming auto-merge"
          gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"

      # Anything but a successful arm also disarms: a refusal, an error in any step, a skipped
      # arm. An auto-merge armed earlier must not survive a run that could not decide.
      # A failed disarm is red.
      - name: Disarm auto-merge after a refusal
        if: always() && steps.arm.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          armed="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" || { echo "::error::could not read the auto-merge state"; exit 1; }
          if [ "$armed" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL" || { echo "::error::could not disarm auto-merge"; exit 1; }
            armed="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" || { echo "::error::could not re-read the auto-merge state"; exit 1; }
            [ "$armed" = "false" ] || { echo "::error::auto-merge is still armed after disarming"; exit 1; }
          fi

  # A person pushing onto a Dependabot branch triggers this event with a different actor, so
  # the job above is skipped. This job disarms whatever was armed. It can only disarm.
  disarm-on-foreign-push:
    name: Disarm auto-merge after a non-Dependabot push
    if: github.actor != 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Disarm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          armed="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" || { echo "::error::could not read the auto-merge state"; exit 1; }
          if [ "$armed" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL" || { echo "::error::could not disarm auto-merge"; exit 1; }
            armed="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" || { echo "::error::could not re-read the auto-merge state"; exit 1; }
            [ "$armed" = "false" ] || { echo "::error::auto-merge is still armed after disarming"; exit 1; }
          fi
