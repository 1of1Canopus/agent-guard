name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker: Testcontainers starts PostgreSQL and Redis for the integration tests.
      - name: Build, test, format check, coverage gate, third-party notices
        run: ./mvnw -B clean verify
      - name: Upload third-party notices
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: "**/target/THIRD-PARTY-NOTICES.txt"
